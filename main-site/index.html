<!doctype html>
<html lang="en">

<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-FMCYFTFPEL"></script>
    <script>
        window.dataLayer = window.dataLayer || [];

        function gtag() {
            dataLayer.push(arguments);
        }
        gtag('js', new Date());

        gtag('config', 'G-FMCYFTFPEL');
    </script>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9715826188316382"
        crossorigin="anonymous"></script>

    <link rel="manifest" href="/manifest.json" />

    <meta charset="utf-8">
    <title>Alarm Clock | UwU Apps</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A free alarm clock in your browser. Set repeating alarms with labels, pick a tone or upload your own, and get alarms even with the app closed.">

    <meta property="og:type" content="website">
    <meta property="og:title" content="Alarm Clock | UwU Apps" />
    <meta property="og:site_name" content="UwU Apps" />
    <meta property="og:description" content="A free alarm clock in your browser. Set repeating alarms with labels, pick a tone or upload your own, and get alarms even with the app closed." />
    <meta property="og:url" content="https://alarm.uwuapps.org/" />
    <link rel="canonical" href="https://alarm.uwuapps.org/" />

    <!-- Theme before first paint. Keep "uwualarm" in step with APP_KEY in
         js/theme.js. -->
    <script>
        (function () {
            var k = "uwualarm";
            var m = localStorage.getItem(k + ".mode") || "light";

            // Time based mode. Resolved here rather than in theme.js because
            // theme.js runs after first paint, and an evening reader would
            // otherwise watch a white page turn dark. Keep the two hours in step
            // with LIGHT_FROM_HOUR and LIGHT_UNTIL_HOUR in theme.js.
            document.documentElement.setAttribute("data-mode-preference", m);
            if (m === "time") {
                var h = new Date().getHours();
                m = h >= 9 && h < 18 ? "light" : "dark";
            }

            var c = localStorage.getItem(k + ".colorTheme") || "classic";
            document.documentElement.setAttribute("data-mode", m);
            document.documentElement.setAttribute("data-color-theme", c);
        })();
    </script>

    <!-- crossorigin so the service worker gets a readable response it can cache for offline -->
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet" crossorigin="anonymous" />
    <link rel="stylesheet" href="/style.css">
    <meta name="theme-color" content="#ccffcc" />

    <!-- Embed Image -->
    <link rel="apple-touch-icon" href="/XAC-main.png">
    <link rel="icon" href="/favicon.ico">
    <link rel="shortcut icon" href="/favicon.ico">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:image:src" content="https://alarm.uwuapps.org/XAC-main.png">
    <meta property="og:image" content="https://alarm.uwuapps.org/XAC-main.png" />
</head>

<body>
    <main class="shell">
        <header class="topbar">
            <div class="brand">
                <span class="dot"></span>
                <span class="title">Alarm<span class="accent">clOwOck</span></span>
            </div>

            <div class="controls">
                <label class="switch">
                    <input type="checkbox" id="formatToggle" />
                    <span class="slider"></span>
                    <span class="label">24h</span>
                </label>

                <label class="volume">
                    <span class="vol-label">Volume</span>
                    <input type="range" id="volume" min="0" max="1" step="0.01" value="0.8" />
                </label>

                <button id="notifBtn" class="btn ghost" type="button">Enable Notifications</button>

                <button class="icon-btn" id="themeBtn" type="button" aria-label="Theme">
                    <span data-icon="sun"></span>
                </button>
            </div>
        </header>

        <section class="clock-card glass">
            <div class="clock">
                <div class="time" id="time">00:00:00</div>
                <div class="date" id="date"></div>
            </div>
            <div class="ringing hidden" id="ringing">
                <div class="ringing-inner">
                    <div class="ringing-body">
                        <div class="ringing-label">
                            <span id="ringingTitle">Alarm</span>
                        </div>
                        <div class="ringing-actions">
                            <button id="snoozeBtn" class="btn primary" type="button">Snooze 5 min</button>
                            <button id="stopBtn" class="btn danger" type="button">Stop</button>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section class="composer glass">
            <h2>Create Alarm</h2>
            <form id="alarmForm" class="grid">
                <label class="field">
                    <span>Time</span>
                    <input type="time" id="alarmTime" required />
                </label>

                <label class="field">
                    <span>Label</span>
                    <input type="text" id="alarmLabel" placeholder="Morning Run" maxlength="60" />
                </label>

                <label class="field">
                    <span>Tone</span>
                    <select id="alarmTone">
                        <option value="chime">Soft Chime</option>
                        <option value="beep">Classic Beep</option>
                        <option value="pulse">Deep Pulse</option>
                        <option value="arpeggio">Arpeggio</option>
                        <!-- A dynamic 'My Uploads' optgroup will be injected here -->
                    </select>
                </label>

                <label class="field">
                    <span>Upload ringtone</span>
                    <input type="file" id="toneFile" accept="audio/*" />
                </label>

                <fieldset class="field days">
                    <legend>Repeat</legend>
                    <label><input type="checkbox" value="1">Mon</label>
                    <label><input type="checkbox" value="2">Tue</label>
                    <label><input type="checkbox" value="3">Wed</label>
                    <label><input type="checkbox" value="4">Thu</label>
                    <label><input type="checkbox" value="5">Fri</label>
                    <label><input type="checkbox" value="6">Sat</label>
                    <label><input type="checkbox" value="0">Sun</label>
                </fieldset>

                <div class="actions">
                    <button type="submit" class="btn primary">Add Alarm</button>
                    <button type="button" id="testBtn" class="btn ghost">Test Tone</button>
                    <button type="button" id="uploadToneBtn" class="btn ghost">Upload</button>
                </div>
            </form>
        </section>

        <section class="alarms glass">
            <h2>Your Alarms</h2>
            <ul id="alarmList" class="alarm-list empty">
            </ul>
            <p class="empty-hint" id="emptyHint">No alarms yet. Create one above.</p>
        </section>

        <footer class="foot">
            <span>Made with <span class="heart" data-icon="heart" role="img" aria-label="love"></span> by Augy.</span>
        </footer>
    </main>

    <audio id="hiddenAudio" preload="auto" hidden></audio>

    <div class="modal-backdrop hidden" id="themeModal">
        <div class="modal glass" role="dialog" aria-modal="true" aria-labelledby="themeModalTitle">
            <div class="modal-head">
                <h2 id="themeModalTitle">Theme</h2>
                <button class="icon-btn small" type="button" data-close-modal="themeModal" aria-label="Close">
                    <span data-icon="close"></span>
                </button>
            </div>
            <p class="modal-section-label">Mode</p>
            <div class="mode-toggle" id="modeToggle">
                <button class="mode-btn" type="button" data-mode="light" aria-pressed="false"><span data-icon="sun"></span>Light</button>
                <button class="mode-btn" type="button" data-mode="dark" aria-pressed="false"><span data-icon="moon"></span>Dark</button>
                <button class="mode-btn mode-btn-wide" type="button" data-mode="time" aria-pressed="false"><span data-icon="clock"></span>Time-based</button>
            </div>
            <p class="mode-note" id="modeNote" hidden></p>
            <p class="modal-section-label">Brand colour</p>
            <div class="swatch-grid" id="swatchGrid"></div>
        </div>
    </div>

    <script type="module" src="/app.js"></script>
    <script type="module" src="/script.js"></script>
</body>

</html>
