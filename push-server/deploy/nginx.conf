# nginx site for the push server. Copy to
# /etc/nginx/sites-available/alarm-push, link it into sites-enabled, then run
# certbot --nginx, which adds the HTTPS part to this file.
server {
    listen 80;
    listen [::]:80;
    server_name alarm-push.uwuapps.org;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        # $remote_addr, not $proxy_add_x_forwarded_for: the server rate-limits
        # on the first address in this header, and appending would let a
        # client put any address it likes first.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
